name: Sync changelog from releases

# Regenerate changelog.mdx from the GitHub Releases of canalesb93/breadbox so the
# docs changelog can never drift from what was actually shipped.
#
# Triggers:
#   - repository_dispatch (release-published): fired by breadbox's release.yml
#     right after a release publishes — near-instant sync.
#   - schedule: daily safety net in case a dispatch is missed.
#   - workflow_dispatch: manual re-sync from the Actions tab.

on:
  repository_dispatch:
    types: [release-published]
  schedule:
    - cron: "17 8 * * *" # daily 08:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-changelog
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate changelog.mdx
        env:
          # Default token can read public repo releases; raises the rate limit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: canalesb93/breadbox
        run: node scripts/gen-changelog.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- changelog.mdx; then
            echo "changelog.mdx already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.mdx
          git commit -m "docs(changelog): sync from GitHub releases"
          git push
